name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: 3.x
          cache: pip

      - name: Install dependencies
        run: pip install build twine

      - name: Build
        run: python3 -m build

      - name: Check
        run: twine check --strict dist/*

      - name: Upload packages artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-packages
          path: dist/

  publish:
    if: github.event_name == 'release'

    environment:
      name: pypi
      url: https://pypi.org/p/molecule-hetznercloud
    permissions:
      id-token: write

    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download packages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-packages
          path: dist/

      - name: Publish packages to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
